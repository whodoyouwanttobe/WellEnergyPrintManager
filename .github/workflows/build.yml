# Тесты на каждый push/PR; сборка exe и релиз для веток dev / beta / main.
#   dev  -> пре-релиз v<версия>-dev.<N>   (канал «Разработка»)
#   beta -> пре-релиз v<версия>-beta.<N>  (канал «Бета»)
#   main -> релиз v<версия>               (канал «Стабильная», рабочие ПК)
name: Test & Release

on:
  push:
    branches: [dev, beta, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"          # русский текст в выводе скриптов и тестов
  PYTHONIOENCODING: utf-8

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-timeout
      - name: Тесты (любой тест > 120 с = зависание = ошибка; оконные — каждый в своём процессе)
        run: python scripts/run_tests.py

  release:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # нужна история и теги, чтобы собрать список изменений
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Проверка папки tools
        shell: pwsh
        run: |
          foreach ($f in "tools/SumatraPDF.exe", "tools/PDFtoPrinter.exe") {
            if (-not (Test-Path $f)) { Write-Error "Нет $f — добавьте папку tools в репозиторий (см. UPDATES.md)"; exit 1 }
          }

      - name: Версия и тег
        id: ver
        run: python scripts/ci_set_version.py

      - name: Стабильный тег не должен повторяться
        if: steps.ver.outputs.channel == 'stable'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.ver.outputs.tag }}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Error "Релиз ${{ steps.ver.outputs.tag }} уже есть. Увеличьте APP_VERSION в core/version.py."
            exit 1
          }
          exit 0

      - name: Сборка exe
        env:
          WPM_EXE_NAME: WPM
        run: python build.py

      - name: Самопроверка собранного exe (окна, анализ, отмена — без зависаний)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $p = Start-Process -FilePath "dist/WPM.exe" -ArgumentList "--self-test=selftest.txt" -PassThru
          $hung = -not $p.WaitForExit(180000)
          if ($hung) { $p.Kill() }
          # Отчёт и журнал печатаем ВСЕГДА — чтобы по логу было видно, что именно не так
          if (Test-Path selftest.txt) {
            Get-Content selftest.txt -Encoding UTF8
            # каждая непройденная проверка — отдельной аннотацией (их видно без входа в GitHub)
            Get-Content selftest.txt -Encoding UTF8 | Where-Object { $_ -like "[[]FAIL]*" } | ForEach-Object {
              $m = ($_ -replace "%", "%25"); Write-Host "::error title=Самопроверка::$m" }
          } else { Write-Host "::error::selftest.txt не создан — exe упал до конца самопроверки" }
          Get-ChildItem $env:TEMP -Directory -Filter "wpm_selftest_*" -ErrorAction SilentlyContinue | ForEach-Object {
            Get-ChildItem $_.FullName -Recurse -Include print_manager.log, crash_native.log -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host "===== $($_.FullName) ====="; Get-Content $_.FullName -Encoding UTF8 -Tail 120
              Get-Content $_.FullName -Encoding UTF8 | Where-Object { $_ -match "ERROR|CRITICAL|Traceback|Error:" } |
                Select-Object -Last 6 | ForEach-Object { $m = ($_ -replace "%", "%25"); Write-Host "::warning title=Журнал exe::$m" } } }
          if ($hung) { Write-Host "::error::exe завис в самопроверке"; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Host "::error::Самопроверка exe не пройдена (код $($p.ExitCode)) — подробности в логе шага"; exit 1 }

      - name: Контрольная сумма
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/WPM.exe -Algorithm SHA256).Hash.ToLower()
          "$h  WPM.exe" | Out-File -Encoding ascii dist/WPM.exe.sha256

      - name: Список изменений (из сообщений коммитов с прошлого релиза этого канала)
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $ch = "${{ steps.ver.outputs.channel }}"
          if ($ch -eq "stable") {
            $prev = git tag --list "v*" --sort=-v:refname | Where-Object { $_ -notmatch "-" } | Select-Object -First 1
          } else {
            $prev = git tag --list "v*-$ch.*" --sort=-creatordate | Select-Object -First 1
          }
          $range = if ($prev) { "$prev..HEAD" } else { "HEAD" }
          $log = git -c i18n.logOutputEncoding=UTF-8 log $range --no-merges --pretty="format:- %s" | Select-Object -First 40
          if (-not $log) { $log = @("- Мелкие исправления") }
          $text = ($log -join "`n")
          if ($prev) { $text += "`n`n(изменения с $prev)" }
          Set-Content -Path notes.md -Value $text -Encoding utf8
          Get-Content notes.md

      - name: Публикация релиза
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $flags = @("--target", "${{ github.sha }}", "--title", "WPM $tag", "--notes-file", "notes.md")
          if ("${{ steps.ver.outputs.prerelease }}" -eq "true") { $flags += "--prerelease" } else { $flags += "--latest" }
          gh release create $tag dist/WPM.exe dist/WPM.exe.sha256 @flags

      - name: Удалить старые dev/beta-релизы (оставить 5 последних каждого)
        if: steps.ver.outputs.channel != 'stable'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ch = "${{ steps.ver.outputs.channel }}"
          $tags = gh release list --limit 100 --json tagName,createdAt | ConvertFrom-Json |
                  Where-Object { $_.tagName -like "*-$ch.*" } | Sort-Object createdAt -Descending |
                  Select-Object -Skip 5
          foreach ($t in $tags) { gh release delete $t.tagName --yes --cleanup-tag }
